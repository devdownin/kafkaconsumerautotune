groups:
  - name: service-health
    rules:
      - alert: AppDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "The application {{ $labels.instance }} has been unreachable for more than 1 minute."
          runbook_url: "http://host.docker.internal:8080/architecture"
          dashboard_url: "http://host.docker.internal:8080/"

  - name: jvm-resource-alerts
    rules:
      - alert: JVMHighCpuUsage
        expr: process_cpu_usage > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is at {{ $value | printf \"%.2f\" }} for over 5 minutes."

      - alert: JVMHighMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High Heap Memory usage on {{ $labels.instance }}"
          description: "Heap memory usage is above 90% (current: {{ $value | printf \"%.2f\" }}) for over 5 minutes."

  - name: resilience-alerts
    rules:
      - alert: PersistenceCircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{name="persistence", state="open"} == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Circuit Breaker 'persistence' is OPEN"
          description: "The database persistence circuit breaker is OPEN on {{ $labels.instance }}. Consumption is likely paused."

  - name: kafka-alerts
    rules:
      - alert: HighKafkaLag
        expr: sum by (group, topic) (kafka_consumer_group_lag) > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Kafka consumer lag"
          description: "Lag for group {{ $labels.group }} on topic {{ $labels.topic }} is {{ $value }} for over 2 minutes."

      - alert: CriticalKafkaLag
        expr: sum by (group, topic) (kafka_consumer_group_lag) > 5000
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical Kafka consumer lag"
          description: "Lag for group {{ $labels.group }} on topic {{ $labels.topic }} is {{ $value }} for over 1 minute."
          dashboard_url: "http://host.docker.internal:8080/consumer-groups"

      - alert: PredictiveMaxPollIntervalSaturation
        expr: |
          predict_linear(app_kafka_events_batch_duration_seconds_max[10m], 3600) >= 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Predictive: Max Poll Interval Saturation"
          description: "Based on the last 10 minutes, the max batch duration is predicted to reach the 300s limit within the next hour."

      - alert: LagRapidIncrease
        expr: |
          deriv(sum by (group) (kafka_consumer_group_lag)[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Lag is increasing rapidly"
          description: "The consumer lag for group {{ $labels.group }} is increasing at a rate of {{ $value | printf \"%.2f\" }} msg/s."

      - alert: KafkaConsumerStopped
        expr: sum by (group) (kafka_consumer_group_members) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka consumer group has no members"
          description: "The consumer group {{ $labels.group }} has 0 active members. No messages are being processed."

  - name: application-performance
    rules:
      - alert: HighProcessingErrorRate
        expr: |
          sum(rate(app_kafka_events_errors_total[5m]))
          /
          sum(rate(app_kafka_events_received_count_total[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High processing error rate"
          description: "Application is failing to process over 10% of incoming messages (current rate: {{ $value | printf \"%.2f\" }})."

      - alert: AbnormallyLongBatchDuration
        expr: app_kafka_events_batch_duration_seconds_max > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Abnormally long batch duration"
          description: "The maximum batch duration is over 3 seconds ({{ $value | printf \"%.2f\" }}s) for 5 minutes. The auto-tuner might be struggling."

  - name: traffic-anomalies
    rules:
      - alert: TrafficDropWeeklyComparison
        expr: |
          sum(rate(app_kafka_events_received_count_total[5m])) < 0.5 * (sum(rate(app_kafka_events_received_count_total[5m] offset 1w)) + 1)
          and
          sum(rate(app_kafka_events_received_count_total[5m] offset 1w)) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Abnormal traffic drop compared to last week"
          description: "Current throughput ({{ $value | printf \"%.2f\" }} msg/s) is less than 50% of what it was at the same time last week. This might indicate an upstream producer issue."

      - alert: TrafficSpikeWeeklyComparison
        expr: |
          sum(rate(app_kafka_events_received_count_total[5m])) > 3 * (sum(rate(app_kafka_events_received_count_total[5m] offset 1w)) + 0.5)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Abnormal traffic spike compared to last week"
          description: "Current throughput ({{ $value | printf \"%.2f\" }} msg/s) is more than 300% of what it was at the same time last week."

      - alert: DLTRateSpike
        expr: |
          sum(rate(app_kafka_events_errors_total[5m])) > 2 * sum(rate(app_kafka_events_errors_total[5m] offset 1h))
          and
          sum(rate(app_kafka_events_errors_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sudden spike in DLT/Errors"
          description: "The rate of errors/DLT has doubled compared to the previous hour (current: {{ $value | printf \"%.2f\" }} msg/s)."

  - name: consumer-stability
    rules:
      - alert: ExcessiveRebalances
        expr: |
          changes(kafka_consumer_group_members{group="ASF.PEAGE.BACKOFFICE.PARTAGE.RECOUVRABLE"}[15m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Excessive consumer group rebalances"
          description: "Consumer group has rebalanced {{ $value }} times in the last 15 minutes. This may indicate unstable network or processing timeouts exceeding max.poll.interval.ms."
          dashboard_url: "http://host.docker.internal:8080/optimizer"

      - alert: AutoTunerInstability
        expr: |
          changes(app_kafka_tuning_batch_duration_smoothed[1h]) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Auto-tuner instability detected"
          description: "The auto-tuner has changed parameters {{ $value }} times in the last hour. This might indicate oscillating system conditions."

  - name: business-alerts
    rules:
      - alert: BusinessTransactionValueDrop
        expr: |
          sum(rate(app_business_transaction_value_total[10m])) < 0.2 * (sum(rate(app_business_transaction_value_total[10m] offset 1w)) + 1)
          and
          sum(rate(app_business_transaction_value_total[10m] offset 1w)) > 10
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Massive drop in transaction value"
          description: "Current processed transaction value ({{ $value | printf \"%.2f\" }} €/s) is less than 20% of last week's average. Possible functional issue."
