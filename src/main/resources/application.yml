logging:
  level:
    root: INFO
    com.vaut: ERROR
    org.springframework.kafka: INFO
    org.hibernate.SQL: ERROR
    org.apache.kafka: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR
    org.springframework.boot.context.config: ERROR

spring:
  application:
    name: kafka-consumer-batch-service
  profiles:
    active: dev

  # Spring Boot Admin Configuration
  boot:
    admin:
      context-path: /admin
      client:
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:8080/admin}
        instance:
          service-base-url: ${SPRING_BOOT_SERVICE_URL:http://localhost:8080}

  # Configuration Kafka Commune
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafkadev:9092}
    consumer:
      group-id: ASF.PEAGE.BACKOFFICE.PARTAGE.RECOUVRABLE
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 100
      fetch-min-bytes: 10240
      fetch-max-wait-ms: 500
      session-timeout-ms: 30000
      max-poll-interval-ms: 300000
      isolation-level: read_committed

    producer:
      # transaction-id-prefix: tx-
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST:localhost}:1521/${DB_SERVICE_NAME:XEPDB1}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
     
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        generate_statistics: false
        format_sql: false

# Configuration de l'application (UI & Business)
app:
  edition: PARTAGE Edition
  service:
    id: USR-SVC-001
    version: 1.0.0
  metrics:
    thresholds:
      "kafka.lag":
        warning: 1000
        critical: 5000
      "kafka.events.received.count":
        warning: 100000
        critical: 500000
      "jvm.memory.used":
        warning: 805306368 # 768MB
        critical: 1073741824 # 1GB
      "process.cpu.usage":
        warning: 0.7
        critical: 0.9
  event:
    id-json-path: "$.idPassage"
  message-viewer:
    blocks:
      - title: "Système"
        jsonPath: "passageSortie.systeme"
      - title: "ETAT DE TRANSACTION"
        jsonPath: "passageSortie.etat"
      - title: "LOCALISATION"
        jsonPath: "passageSortie.localisation.gare"

# Configuration spécifique à l'application
kafka:
  topic:
    name: asf.peage.backoffice.sortie.recouvrable
    dlt: asf.peage.backoffice.sortie.recouvrable.dlt
  tuning:
    # Durée cible de traitement d'un batch en millisecondes.
    # Le moteur d'auto-tune ajustera le max.poll.records pour essayer de stabiliser le traitement à cette valeur.
    target-batch-duration-ms: 1200.0

    # Coefficients du contrôleur PID (Proportional, Integral, Derivative)
    # kP : Réaction proportionnelle à l'erreur actuelle (vitesse de réaction initiale)
    kp: 150.0
    # kI : Réaction proportionnelle à l'accumulation des erreurs passées (élimination de l'erreur statique)
    ki: 20.0
    # kD : Réaction proportionnelle à la tendance de l'erreur (amortissement des oscillations)
    kd: 50.0

    # Intervalle minimum entre deux redémarrages du consommateur (en ms).
    # Évite les "rebalance storms" en limitant la fréquence des changements de configuration réels.
    min-restart-interval-ms: 300000

    # Seuil de changement minimal (0.1 = 10%).
    # Une modification de paramètre n'est appliquée que si elle dépasse ce seuil par rapport à la valeur actuelle.
    change-threshold: 0.1

    # Limites de sécurité pour le paramètre max.poll.records
    min-max-poll-records: 20
    max-max-poll-records: 1000

    # Paramètres de planification de la tâche de tuning (en ms)
    initial-delay: 30000
    fixed-rate: 60000

    # Facteur de lissage (EMA) pour la durée de batch (0.2 = lissage fort, 0.8 = lissage faible)
    ema-alpha: 0.2

resilience4j:
  circuitbreaker:
    instances:
      persistence:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        recordExceptions:
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.DataAccessResourceFailureException
          - java.sql.SQLException
  retry:
    instances:
      persistence:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.ConcurrencyFailureException

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        kafka.events.batch.duration: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  # Exposition des endpoints Actuator pour le monitoring (Prometheus, Health, etc.)
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

---
# PROFIL: DEV (Plaintext + Embedded DB)
spring:
  config:
    activate:
      on-profile: dev
    
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password:
    
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafkadev:9092}
    ssl:
      enabled: false

---
# PROFIL: REC (SSL)
spring:
  config:
    activate:
      on-profile: rec
            
  kafka:
    bootstrap-servers: ${KAFKA_REC_BOOTSTRAP_SERVERS:kafkadev:9092}
    ssl:
      enabled: true
      trust-store-location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:classpath:client.truststore.jks}
      trust-store-password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
      key-store-location: ${KAFKA_SSL_KEYSTORE_LOCATION:classpath:client.keystore.jks}
      key-store-password: ${KAFKA_SSL_KEYSTORE_PASSWORD}
      key-password: ${KAFKA_SSL_KEY_PASSWORD}

---
# PROFIL: LOCAL-H2 (Local Kafka + H2 DB)
spring:
  config:
    activate:
      on-profile: local-h2

  datasource:
    url: jdbc:h2:mem:localdb;DB_CLOSE_DELAY=-1;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  kafka:
    bootstrap-servers: localhost:9092
    ssl:
      enabled: false

---
# PROFIL: TEST
spring:
  config:
    activate:
      on-profile: test
