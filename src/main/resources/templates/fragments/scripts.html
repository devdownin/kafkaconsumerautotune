<!-- Common Scripts Fragment -->
<div th:fragment="common-scripts" xmlns:th="http://www.thymeleaf.org">
    <script th:inline="javascript">
        function initThemeToggle() {
            var themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
            var themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
            if (!themeToggleDarkIcon || !themeToggleLightIcon) return;

            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                themeToggleLightIcon.classList.remove('hidden');
            } else {
                themeToggleDarkIcon.classList.remove('hidden');
            }

            var themeToggleBtn = document.getElementById('theme-toggle');
            if (!themeToggleBtn) return;

            themeToggleBtn.addEventListener('click', function() {
                themeToggleDarkIcon.classList.toggle('hidden');
                themeToggleLightIcon.classList.toggle('hidden');

                if (localStorage.getItem('color-theme')) {
                    if (localStorage.getItem('color-theme') === 'light') {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    }
                } else {
                    if (document.documentElement.classList.contains('dark')) {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    } else {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                    }
                }
            });
        }

        function updateWsStatus(connected) {
            const dot = document.getElementById('ws-status-dot');
            const text = document.getElementById('ws-status-text');
            if (!dot || !text) return;
            if (connected) {
                dot.classList.remove('bg-slate-400', 'bg-rose-500');
                dot.classList.add('bg-emerald-500');
                dot.classList.remove('animate-pulse');
                text.innerText = 'WS: Connected';
            } else {
                dot.classList.remove('bg-slate-400', 'bg-emerald-500');
                dot.classList.add('bg-rose-500');
                dot.classList.add('animate-pulse');
                text.innerText = 'WS: Disconnected';
            }
        }
    </script>
</div>
