tuning.explanation.stable=Throughput is stable. Target duration is met.
tuning.explanation.increase=Processing is fast. Increasing batch size and concurrency to maximize throughput.
tuning.explanation.decrease=Processing is too slow or approaching limits. Reducing load to ensure stability.
tuning.explanation.fallback=Resilience mode: fallback to individual processing due to high error rate.
tuning.explanation.recovery=Recovery mode: gradually increasing load after incident.
