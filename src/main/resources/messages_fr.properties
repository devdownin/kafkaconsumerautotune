tuning.explanation.stable=Le débit est stable. La durée cible est atteinte.
tuning.explanation.increase=Le traitement est rapide. Augmentation de la taille des lots et de la parallélisation pour maximiser le débit.
tuning.explanation.decrease=Le traitement est trop lent ou approche des limites. Réduction de la charge pour garantir la stabilité.
tuning.explanation.fallback=Mode résilience : repli sur un traitement individuel suite à un taux d'erreur élevé.
tuning.explanation.recovery=Mode récupération : augmentation progressive de la charge après incident.
