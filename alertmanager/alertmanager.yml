route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    - match:
        severity: critical
      receiver: slack
receivers:
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://app:8080/api/alerts/webhook'
  - name: 'slack'
    slack_configs:
      - channel: '#alerts'
        api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX' # Placeholder
  - name: 'teams'
    webhook_configs:
      - url: 'https://outlook.office.com/webhook/xxxxxxx/IncomingWebhook/xxxxxxx' # Placeholder
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
