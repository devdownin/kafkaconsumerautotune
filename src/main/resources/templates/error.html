<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Page')}">
    <title>Page</title>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 shadow-2xl text-center space-y-6">
        <div class="size-20 bg-rose-500/10 text-rose-500 rounded-full flex items-center justify-center mx-auto">
            <span class="material-symbols-outlined text-4xl">error</span>
        </div>

        <div class="space-y-2">
            <h1 class="text-2xl font-bold">Something went wrong</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm">An unexpected error occurred while processing your request.</p>
        </div>

        <div class="bg-slate-50 dark:bg-slate-800/50 rounded-xl p-4 text-left border border-slate-100 dark:border-slate-800">
            <div class="flex flex-col gap-2">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Error Detail</p>
                <p class="text-sm font-mono text-rose-600 dark:text-rose-400 break-words" th:text="${error}">InternalServerError</p>
                <p class="text-xs text-slate-600 dark:text-slate-400 mt-1" th:text="${message}">Unexpected termination of request.</p>
            </div>
        </div>

        <div class="pt-2">
            <a href="/" class="inline-flex items-center justify-center gap-2 w-full h-11 bg-primary text-white rounded-xl font-bold hover:bg-blue-600 transition-all shadow-lg shadow-blue-500/20">
                <span class="material-symbols-outlined text-xl">home</span>
                Back to Dashboard
            </a>
            <button onclick="window.history.back()" class="mt-3 text-sm font-semibold text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition-colors">
                Go Back
            </button>
        </div>

        <p class="text-[10px] text-slate-400 font-medium">Path: <span class="font-mono" th:text="${path}">/unknown</span></p>
    </div>
</body>
</html>
