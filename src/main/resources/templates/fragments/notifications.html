<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Conteneur des toasts. La logique est dans static/js/notifications.js : servie
  en fichier statique et mise en cache, au lieu d'être réémise dans chaque
  réponse HTML.

  aria-live pour que les lecteurs d'écran annoncent les toasts ; pointer-events
  seulement sur les enfants, pour que la pile (pleine largeur sur mobile) ne
  bloque jamais les clics en dessous.
-->
<div th:fragment="notifications" id="toast-container" role="status" aria-live="polite" aria-atomic="false"
     class="fixed bottom-8 right-8 z-[100] flex flex-col gap-3 pointer-events-none"></div>

</body>
</html>
