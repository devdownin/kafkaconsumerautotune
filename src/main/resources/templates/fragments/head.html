<!-- Common Head Metadata Fragment -->
<head th:fragment="head(title)" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <!-- stats is absent on the error page: keep the fragment renderable without it -->
    <title th:text="${stats != null ? title + ' - ' + stats.appName : title}">Kafka Monitor</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}"/>

    <!--
      Every asset is served by this application, never by a CDN: the UI works
      air-gapped, versions cannot shift under us, and no third party sees the
      traffic. See static/vendor/README.md to refresh the fonts and libraries.
    -->
    <link rel="stylesheet" th:href="@{/vendor/css/inter.css}"/>
    <link rel="stylesheet" th:href="@{/vendor/css/material-symbols.css}"/>

    <!--
      app.css is compiled by Maven from src/main/frontend/app.css; it carries
      the Tailwind theme and this UI's own rules. It replaces the Tailwind CDN,
      which shipped the whole engine and recompiled the classes in the browser
      on every page load. Regenerating it is a build step: see
      docs/frontend-build.md.
    -->
    <link rel="stylesheet" th:href="@{/vendor/css/app.css}"/>

    <!--
      defer: none of these are needed before first paint. Pages must therefore
      bootstrap SockJS/Stomp/ApexCharts from DOMContentLoaded, never inline.
    -->
    <script defer th:src="@{/vendor/js/sockjs-1.6.1.min.js}"></script>
    <script defer th:src="@{/vendor/js/stomp-2.3.3.min.js}"></script>
    <script defer th:src="@{/vendor/js/apexcharts-6.8.0.min.js}"></script>

    <!--
      Stays inline and synchronous on purpose: it must set the theme class before
      the first paint, otherwise a dark-mode user gets a white flash. The theme
      itself now lives in tailwind.config.js, applied at build time.
    -->
    <script id="theme-preference">
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
