name: Docker Hub

on:
  release:
    types: [published]
  # Permet de republier une version sans recréer la release, par exemple
  # après un incident côté registre.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag Git à publier (ex. v1.0.1)"
        required: true

permissions:
  contents: read

env:
  # Le dépôt Docker Hub visé. Surchargeable par une variable de dépôt
  # DOCKERHUB_IMAGE si l'espace de noms Docker Hub diffère du propriétaire
  # GitHub. Ce n'est volontairement pas un secret : masquer le nom de l'image
  # rendrait illisibles les journaux de publication.
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'devdownin/kafkaconsumerautotune' }}

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dérive les tags du tag Git : 1.0.1 publie aussi 1.0, 1 et latest.
      # Une pré-version (1.0.1-rc1) ne prend pas latest.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=KafkaConsumerAutoTune
            org.opencontainers.image.description=Self-adaptive Kafka consumer with PID-based auto-tuning
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Image publiée"
            echo
            echo "Digest : \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Tags :"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
