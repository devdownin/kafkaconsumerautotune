<!-- Common Head Metadata Fragment -->
<head th:fragment="head(title)" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <!-- stats is absent on the error page: keep the fragment renderable without it -->
    <title th:text="${stats != null ? title + ' - ' + stats.appName : title}">Kafka Monitor</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}"/>

    <!-- Warm up the third-party origins before the first asset request is issued -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com"/>
    <link rel="preconnect" href="https://cdn.jsdelivr.net"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!--
      defer: none of these are needed before first paint. Pages must therefore
      bootstrap SockJS/Stomp/ApexCharts from DOMContentLoaded, never inline.
    -->
    <script defer src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <!--
      icon_names subsets the Material Symbols font to the glyphs this UI actually
      uses (~60) instead of shipping the full ~3 500 icon set. Any icon added to a
      template or injected from JS must be appended to this list.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;icon_names=account_tree,add,analytics,architecture,arrow_drop_down,arrow_drop_up,auto_fix_high,cancel,check_circle,chevron_right,close,cloud_off,code,content_copy,dark_mode,dashboard,database,database_off,delete,delete_sweep,description,download,edit,error,error_outline,expand_more,group_work,home,hourglass_top,hub,info,inventory_2,light_mode,list_alt,memory,menu,menu_book,monitoring,move_to_inbox,play_arrow,query_stats,refresh,remove,replay,rocket_launch,save,search,settings,speed,stop,sync,sync_problem,trending_down,trending_up,unfold_more,visibility,warning&amp;display=swap" rel="stylesheet"/>

    <script id="tailwind-config">
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "primary-dark": "#0f49bd",
                        "background-light": "#f6f6f8",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Keyboard focus stays visible everywhere, including on custom controls. */
        :focus-visible { outline: 2px solid #135bec; outline-offset: 2px; border-radius: 0.25rem; }

        /* Skip link: first tab stop on every page, visible only once focused. */
        .skip-link {
            position: absolute; left: 0.5rem; top: -3rem; z-index: 200;
            padding: 0.5rem 1rem; border-radius: 0.5rem;
            background: #135bec; color: #fff; font-size: 0.75rem; font-weight: 700;
            transition: top 0.15s ease-in-out;
        }
        .skip-link:focus { top: 0.5rem; }

        /*
          data-tooltip was used on several pages but never had an implementation,
          so those hints simply never rendered. Pure CSS, no JS, no layout cost.
        */
        [data-tooltip] { position: relative; }
        [data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute; top: calc(100% + 6px); left: 50%;
            transform: translateX(-50%) scale(0.96);
            padding: 0.25rem 0.5rem; border-radius: 0.375rem;
            background: #0f172a; color: #f8fafc;
            font-size: 10px; font-weight: 600; line-height: 1.4; letter-spacing: 0;
            text-transform: none; white-space: nowrap;
            opacity: 0; pointer-events: none; z-index: 90;
            transition: opacity 0.12s ease-in-out, transform 0.12s ease-in-out;
        }
        [data-tooltip]:hover::after,
        [data-tooltip]:focus-visible::after { opacity: 1; transform: translateX(-50%) scale(1); }
        .dark [data-tooltip]::after { background: #e2e8f0; color: #0f172a; }
        /* Tooltips on the status bar would be clipped downwards: flip them up. */
        footer [data-tooltip]::after { top: auto; bottom: calc(100% + 6px); }

        /*
          Off-canvas sidebar below lg. Previously the 16rem sidebar was always in
          flow, leaving almost nothing for the content on small screens.
        */
        @media (max-width: 1023px) {
            #app-sidebar {
                position: fixed; top: 0; bottom: 0; left: 0; z-index: 70;
                transform: translateX(-100%);
                transition: transform 0.2s ease-in-out;
                box-shadow: 0 10px 40px rgba(15, 23, 42, 0.35);
            }
            #app-sidebar.is-open { transform: translateX(0); }
            #sidebar-overlay.is-open { display: block; }
            #sidebar-toggle { display: inline-flex; }
            /* Keep the page title clear of the floating menu button. */
            main > header { padding-left: 4rem; }
        }

        /* Respect the OS "reduce motion" setting: this UI animates a lot. */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
