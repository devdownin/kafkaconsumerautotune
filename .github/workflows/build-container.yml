name: Build and Package Container

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        tags: kafka-consumer-demo:latest
        load: true
        # Layer cache: without it every run re-resolved the whole Maven dependency tree from
        # scratch. Paired with the separate dependency layer in the Dockerfile, a source-only
        # change now reuses the cached dependencies.
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract JAR from Container
      run: |
        docker create --name temp-container kafka-consumer-demo:latest
        docker cp temp-container:/app/app.jar ./kafka-consumer-demo.jar
        docker rm temp-container

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kafka-consumer-jar
        path: ./kafka-consumer-demo.jar
        retention-days: 14
