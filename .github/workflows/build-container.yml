name: Build and Package Container

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: kafka-consumer-demo:latest
        load: true

    - name: Extract JAR from Container
      run: |
        docker create --name temp-container kafka-consumer-demo:latest
        docker cp temp-container:/app/app.jar ./kafka-consumer-demo.jar
        docker rm temp-container

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kafka-consumer-jar
        path: ./kafka-consumer-demo.jar
